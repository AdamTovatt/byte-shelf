<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ByteShelf">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ByteShelf</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        const THEME_STORAGE_KEY = 'byteshelf-theme';
        let stored = null;
        try { stored = localStorage.getItem(THEME_STORAGE_KEY); } catch (e) {}
        let resolvedTheme = 'light';
        if (stored === 'dark') { resolvedTheme = 'dark'; }
        else if (stored === 'light') { resolvedTheme = 'light'; }
        else { try { resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) {} }
        if (resolvedTheme === 'dark') { document.documentElement.classList.add('dark'); }
        else { document.documentElement.classList.remove('dark'); }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
